<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Alejo Tools</title>
  <link rel="stylesheet" href="styles.css" />
  <style id="themes-style"></style>
</head>
<body>
  <div id="app">
    <header id="app-bar">
      <button id="app-bar-back" class="hidden" aria-label="Volver">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M14.5 5 8 12l6.5 7" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span id="app-bar-icon"></span>
      <div id="app-bar-text">
        <h1 id="app-bar-title">Alejo Tools</h1>
        <p id="app-bar-desc"></p>
      </div>
      <!-- NUEVO (pedido del usuario -- "el ícono de settings parece un
           sol, no una tuerca"): este SVG estaba HARDCODEADO acá, separado
           del set de icons.js -- un círculo + 8 líneas rectas con puntas
           redondeadas es, a este tamaño, indistinguible de un ícono de sol
           (así se lee, por ejemplo, en Feather Icons). Reemplazado por el
           mismo path de engranaje real (Material Design "settings", dientes
           trapezoidales fundidos al cuerpo) que ahora usa icons.js. -->
      <button id="app-bar-settings" aria-label="Configuración">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" fill="currentColor" d="M19.14,12.94c0.04,-0.3 0.06,-0.61 0.06,-0.94c0,-0.32 -0.02,-0.64 -0.07,-0.94l2.03,-1.58c0.18,-0.14 0.23,-0.41 0.12,-0.61l-1.92,-3.32c-0.12,-0.22 -0.37,-0.29 -0.59,-0.22l-2.39,0.96c-0.5,-0.38 -1.03,-0.7 -1.62,-0.94L14.4,2.81c-0.04,-0.24 -0.24,-0.41 -0.48,-0.41h-3.84c-0.24,0 -0.43,0.17 -0.47,0.41L9.25,5.35C8.66,5.59 8.12,5.92 7.63,6.29L5.24,5.33c-0.22,-0.08 -0.47,0 -0.59,0.22L2.74,8.87C2.62,9.08 2.66,9.34 2.86,9.48l2.03,1.58C4.84,11.36 4.8,11.69 4.8,12s0.02,0.64 0.07,0.94l-2.03,1.58c-0.18,0.14 -0.23,0.41 -0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39,-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.44,-0.17 0.47,-0.41l0.36,-2.54c0.59,-0.24 1.13,-0.56 1.62,-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59,-0.22l1.92,-3.32c0.12,-0.22 0.07,-0.47 -0.12,-0.61L19.14,12.94zM12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6s3.6,1.62 3.6,3.6S13.98,15.6 12,15.6z"/></svg>
      </button>
    </header>

    <main id="content">
      <!-- Hub / pantalla base: buscador + Bento grid + tab bar de pilares -->
      <div id="hub-view">
        <div id="hub-search-row">
          <div id="hub-search-icon"></div>
          <input id="hub-search" type="search" placeholder="Buscar herramienta..." autocomplete="off" />
        </div>
        <div id="hub-bento"></div>
        <!-- Resultados del buscador -- mismas filas que #category-list, se
             muestra en vez de #hub-bento mientras hay texto escrito. -->
        <div id="hub-search-results" class="hidden"></div>
      </div>

      <!-- Vista de categoría: lista filtrada de un pilar -->
      <div id="category-view" class="hidden">
        <div id="category-title"></div>
        <div id="category-list"></div>
      </div>

      <!-- Herramienta a pantalla completa -- sin cambios -->
      <div id="tool-view" class="hidden">
        <div id="tool-input-area"></div>
        <div id="tool-output"></div>
      </div>
    </main>

    <!-- Tab bar de 4 pilares -- visible en Hub y en categoría, oculta
         dentro de una herramienta (mismo criterio que #app-bar-back). -->
    <nav id="pillar-tabbar">
      <button class="pillar-tab" data-pillar="hub" aria-label="Favoritos"><span class="pt-ico"></span><span class="pt-lbl">Favoritos</span></button>
      <button class="pillar-tab" data-pillar="connect" aria-label="Conectividad"><span class="pt-ico"></span><span class="pt-lbl">Conecta</span></button>
      <button class="pillar-tab" data-pillar="product" aria-label="Productividad"><span class="pt-ico"></span><span class="pt-lbl">Product.</span></button>
      <button class="pillar-tab" data-pillar="create" aria-label="Suite Creativa"><span class="pt-ico"></span><span class="pt-lbl">Creativa</span></button>
    </nav>
  </div>
  <style id="tool-style-override"></style>
  <script src="/icons.js" defer></script>
  <script src="/lector-icons.js" defer></script>
  <script type="module" src="/main.js" defer></script>
</body>
</html>
