<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Alejo Tools</title>
  <link rel="stylesheet" href="styles.css" />
  <style id="themes-style"></style>
</head>
<body>
  <div id="app">
    <header id="app-bar">
      <button id="app-bar-back" class="hidden" aria-label="Volver">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M14.5 5 8 12l6.5 7" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span id="app-bar-icon"></span>
      <div id="app-bar-text">
        <h1 id="app-bar-title">Alejo Tools</h1>
        <p id="app-bar-desc"></p>
      </div>
      <button id="app-bar-settings" aria-label="Configuración">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.1" stroke="currentColor" stroke-width="1.9"/><path d="M12 3.5v2.3M12 18.2v2.3M20.5 12h-2.3M5.8 12H3.5M17.8 6.2l-1.6 1.6M7.8 16.2l-1.6 1.6M17.8 17.8l-1.6-1.6M7.8 7.8 6.2 6.2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      </button>
    </header>

    <main id="content">
      <!-- Hub / pantalla base: buscador + Bento grid + tab bar de pilares -->
      <div id="hub-view">
        <div id="hub-search-row">
          <div id="hub-search-icon"></div>
          <input id="hub-search" type="search" placeholder="Buscar herramienta..." autocomplete="off" />
        </div>
        <div id="hub-bento"></div>
        <!-- Resultados del buscador -- mismas filas que #category-list, se
             muestra en vez de #hub-bento mientras hay texto escrito. -->
        <div id="hub-search-results" class="hidden"></div>
      </div>

      <!-- Vista de categoría: lista filtrada de un pilar -->
      <div id="category-view" class="hidden">
        <div id="category-title"></div>
        <div id="category-list"></div>
      </div>

      <!-- Herramienta a pantalla completa -- sin cambios -->
      <div id="tool-view" class="hidden">
        <div id="tool-input-area"></div>
        <div id="tool-output"></div>
      </div>
    </main>

    <!-- Tab bar de 4 pilares -- visible en Hub y en categoría, oculta
         dentro de una herramienta (mismo criterio que #app-bar-back). -->
    <nav id="pillar-tabbar">
      <button class="pillar-tab" data-pillar="hub" aria-label="Favoritos"><span class="pt-ico"></span><span class="pt-lbl">Favoritos</span></button>
      <button class="pillar-tab" data-pillar="connect" aria-label="Conectividad"><span class="pt-ico"></span><span class="pt-lbl">Conecta</span></button>
      <button class="pillar-tab" data-pillar="product" aria-label="Productividad"><span class="pt-ico"></span><span class="pt-lbl">Product.</span></button>
      <button class="pillar-tab" data-pillar="create" aria-label="Suite Creativa"><span class="pt-ico"></span><span class="pt-lbl">Creativa</span></button>
    </nav>
  </div>
  <style id="tool-style-override"></style>
  <script src="/icons.js" defer></script>
  <script src="/lector-icons.js" defer></script>
  <script type="module" src="/main.js" defer></script>
</body>
</html>
