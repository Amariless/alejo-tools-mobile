[package]
name = "alejo-tools-mobile"
version = "0.1.12"
description = "Alejo Tools Mobile"
authors = ["Amariles"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "alejo_tools_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# NUEVO: en Android, lo que tauri.conf.json empaqueta como "resources"
# (tools/) queda dentro de assets/ del APK -- no es un filesystem normal,
# std::fs no puede leerlo ahí (solo el AssetManager de Android, vía JNI).
# En vez de pelear con eso por plataforma, tools/ se embebe DENTRO del
# binario en tiempo de compilación -- funciona idéntico en dev (Windows) y
# en el APK final, sin ningún código específico de Android.
# "debug-embed": por defecto rust-embed SOLO embebe de verdad en builds
# release -- en debug (lo que usa `tauri android build --debug`) redirige
# las lecturas al disco del proyecto (pensado para hot-reload en desktop),
# que no existe en el teléfono. Sin este feature, el bug de "Sin
# herramientas todavía" hubiera seguido igual en cualquier build debug.
rust-embed = { version = "8", features = ["debug-embed"] }
# SyncManager: cliente HTTP de la API REST local de Syncthing-Android
# (127.0.0.1:8384, la misma que usa su propia interfaz web) -- no
# vendorizamos binario propio, ver comentario en syncthing.rs.
# rustls (no native-tls/openssl): openssl-sys no cross-compila limpio
# contra el NDK de Android sin vendorizar/linkear OpenSSL a mano; rustls es
# Rust puro, mismo binario en Windows dev y en el APK sin config extra.
#
# NUEVO (confirmado en vivo -- panic real en el emulador): el backend
# rustls de reqwest, en Android, usa por defecto rustls-platform-verifier
# (habla con el keystore de Android vía JNI) y ESO requiere inicializarlo a
# mano pasándole el contexto de Android desde Kotlin/Java ANTES de la
# primera request -- según el propio README del crate hace falta agregar
# un componente Kotlin al build.gradle, no alcanza con Cargo.toml. En vez
# de meternos con Gradle/Kotlin para esto, ver tls.rs: se arma un
# rustls::ClientConfig a mano con raíces embebidas (webpki-roots, ver más
# abajo) y se lo pasa a reqwest con use_preconfigured_tls() -- eso evita
# por completo el camino de rustls-platform-verifier.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
# NUEVO (instalador in-app): descarga el .apk como stream en vez de bytes
# enteros en memoria (son 150-280MB -- cargarlo entero de una en RAM en un
# teléfono es innecesario) y lo va escribiendo a disco a medida que llega.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["fs", "time", "io-util"] }
# "aws-lc-rs" (no "ring"): reqwest ya trae aws-lc-sys como su backend
# criptográfico por defecto (ya cross-compiló bien para aarch64-android en
# este mismo proyecto) -- usar el mismo acá evita compilar DOS backends de
# criptografía nativa distintos para lo mismo.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
webpki-roots = "1"
# Auto-actualización (Settings): QR del propio ID de Syncthing, mismo
# mecanismo que el escritorio (armar el SVG a mano con QrCode::to_colors(),
# sin el feature "svg" del crate).
qrcode = { version = "0.14", default-features = false }
once_cell = "1"
# SyncManager: conflictos de sincronización (regex para parsear nombres
# ".sync-conflict-...") y detección de duplicados (hash del contenido) --
# mismo mecanismo 1:1 que el escritorio, ver syncthing.rs.
regex = "1"
sha2 = "0.10"

# NUEVO (instalador in-app de actualizaciones, ver installer.rs): Android
# no deja pedirle a otra app (el instalador de paquetes del sistema) que
# abra un archivo file:// de nuestro propio storage privado -- hace falta
# convertirlo a una URI content:// vía FileProvider (ya declarado en
# AndroidManifest.xml) y lanzar el Intent de instalación a mano. Ni Tauri
# ni tauri-plugin-opener hacen esa conversión por nosotros en Android (se
# confirmó leyendo su fuente: openPath ahí simplemente hace
# Intent.ACTION_VIEW sobre el path crudo, lo cual con un archivo propio
# tira FileUriExposedException) -- así que se llama a FileProvider/Intent
# directo por JNI, usando el WebviewWindow::with_webview(...).jni_handle()
# que Tauri/wry ya exponen (ver installer.rs para el porqué NO se usa el
# crate "ndk-context": esta versión de tao no lo inicializa, panickea en
# vivo con "android context was not initialized").
jni = "0.21"

# NUEVO (segundo bug real, confirmado en vivo -- "NoClassDefFoundError:
# Class not found using the boot class loader"): buscar la clase
# "androidx/core/content/FileProvider" por nombre con call_static_method
# panickeaba porque el hilo donde wry corre el JNI (JniHandle::exec)
# resuelve clases contra el classloader del SISTEMA, no el de esta app --
# FileProvider (AndroidX) solo existe en el .dex de la app, nunca en el
# boot classpath, así que ese lookup fallaba siempre (java.io.File y
# android.content.Intent sí son del framework, esos sí se encuentran
# igual). wry::find_class() es el helper que el propio wry expone para
# este problema exacto: le pide la clase a la Activity (que sí tiene el
# classloader correcto) en vez de buscarla directo por FindClass.
[target.'cfg(target_os = "android")'.dependencies]
wry = "0.55"

