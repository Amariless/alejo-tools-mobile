name: Build y publicar Android

# Se dispara con cada push a main: compila el .apk (Tauri Android, debug
# universal -- mismo tipo de build que se venía shippeando a mano con
# release.ps1, ver README/CLAUDE para el contexto) y lo publica como
# GitHub Release taggeado con la versión de src-tauri/Cargo.toml. La app
# revisa el release más reciente desde Configuración → Buscar
# actualización (ver update.rs) sin que haga falta pasar el .apk a mano.
#
# Requiere 3 secrets del repo (Settings → Secrets and variables →
# Actions) para firmar con la MISMA clave que las versiones ya instaladas
# -- si no están seteados, el build va a fallar en el paso "Configurar
# firma de Android" en vez de publicar algo sin firmar o mal firmado:
#   ANDROID_KEY_ALIAS     -- alias de la clave dentro del keystore
#   ANDROID_KEY_PASSWORD  -- contraseña del keystore/clave
#   ANDROID_KEY_BASE64    -- el .jks/.keystore entero, en base64
#                            (generar con: base64 -w0 tu-keystore.jks)
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  NDK_VERSION: "27.0.12077973"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Rust + targets de Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src-tauri/gen/android/**/*.gradle*') }}

      - name: Configurar Android SDK
        # NUEVO (corrida real del 15/09: el runner de ubuntu-latest NO tenía
        # "sdkmanager" en el PATH -- "command not found", exit 127 --
        # a diferencia de lo asumido antes. Esta action deja el SDK +
        # cmdline-tools instalados y ANDROID_HOME seteado de forma
        # confiable, sin depender de qué traiga la imagen del runner.
        uses: android-actions/setup-android@v3

      - name: Instalar NDK
        # Se instala una versión fija (no "lo que venga preinstalado") para
        # que el build no cambie de comportamiento sin aviso si cambia la
        # imagen del runner. Ruta explícita al binario en vez de confiar en
        # el PATH -- mismo motivo que arriba.
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "No se encontró sdkmanager en $SDKMANAGER"; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;${{ env.NDK_VERSION }}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Instalar dependencias (@tauri-apps/cli)
        run: npm ci

      - name: Configurar firma de Android
        run: |
          cd src-tauri/gen/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      - name: Leer versión de Cargo.toml
        id: version
        run: |
          v=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        run: npx tauri android build --debug --apk

      - name: Ubicar el APK generado
        id: apk
        run: |
          f=$(find src-tauri/gen/android/app/build/outputs/apk -iname "*.apk" | head -1)
          test -n "$f" || { echo "No se generó ningún .apk"; exit 1; }
          echo "path=$f" >> "$GITHUB_OUTPUT"

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Alejo Tools v${{ steps.version.outputs.version }}"
          body: |
            Build automática desde el commit ${{ github.sha }}.
            Instalala directo en el cel: bajá el .apk de abajo y abrilo,
            o usá "Buscar actualización" dentro de la app (Configuración).
          make_latest: true
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
